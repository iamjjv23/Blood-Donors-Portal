<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donor Profile | Blood Donation Portal</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="icon" type="image/x-icon" href="../img/favicon.png">
</head>
<body class="bodybg">

    <div class="container">
	<center><img class="logosimg" src="../img/dpll.png" alt="Logo"></center>
        <div class="header">
            <h2>Donor Profile</h2>
            <button class="btn-back" onclick="goBack()">&larr; Back</button>
        </div>
        
        <div id="message">Loading donor details...</div>

        <div class="profile-card" id="profileCard">
            <div style="text-align: center;">
                <div class="blood-group-badge" id="lblBloodGroup">--</div>
                <h3 style="margin-top: 0; color: #333;" id="lblName">Donor Name</h3>
            </div>
            
            <div class="detail-row">
                <div class="detail-label">Donor ID:</div>
                <div class="detail-value" id="lblId">--</div>
            </div>
            <div class="detail-row">
                <div class="detail-label">Contact Number:</div>
                <div class="detail-value" id="lblContact">--</div>
            </div>
            <div class="detail-row">
                <div class="detail-label">Location:</div>
                <div class="detail-value" id="lblLocation">--</div>
            </div>
            <div class="detail-row">
                <div class="detail-label">Last Donation Date:</div>
                <div class="detail-value" id="lblLastDonation">--</div>
            </div>
            <div class="detail-row">
                <div class="detail-label">Current Status:</div>
                <div class="detail-value" id="lblStatus">--</div>
            </div>
        </div>
    </div>

    <script>
        const API = 'UPH';
        const token = localStorage.getItem('token');
        const role = localStorage.getItem('role');

        window.onload = () => {
            if (!token) {
                alert('Unauthorized access. Redirecting to login.');
                window.location.href = '../index.html'; 
                return;
            }

            const urlParams = new URLSearchParams(window.location.search);
            const donorId = urlParams.get('id');

            if (!donorId) {
                document.getElementById('message').textContent = 'Error: No Donor ID provided in the URL.';
                document.getElementById('message').style.color = 'red';
            } else {
                fetchDonorDetails(donorId);
            }
        };

        async function fetchDonorDetails(donorId) {
            const msgDiv = document.getElementById('message');
            const card = document.getElementById('profileCard');
            
            try {
                const response = await fetch(`${SCRIPT_URL}?action=getDonor&id=${donorId}&token=${token}`);
                const result = await response.json();

                if (result.status === 'success') {
                    msgDiv.style.display = 'none';
                    card.style.display = 'block';

                    document.getElementById('lblId').textContent = result.donor.id;
                    document.getElementById('lblName').textContent = result.donor.name;
                    document.getElementById('lblBloodGroup').textContent = result.donor.bloodGroup;
                    document.getElementById('lblContact').textContent = result.donor.contact;
                    document.getElementById('lblLocation').textContent = result.donor.location;
                    
                    // ==========================================
                    // NEW: DATE FORMATTER
                    // ==========================================
                    let rawDate = result.donor.lastDonation;
                    let displayDate = rawDate;
                    
                    if (rawDate && rawDate !== 'Never' && rawDate.includes('T')) {
                        // Converts timestamp into a clean local date (e.g., 1 Sep 2026)
                        const dateObj = new Date(rawDate);
                        displayDate = dateObj.toLocaleDateString('en-GB', { 
                            day: 'numeric', month: 'short', year: 'numeric' 
                        });
                    }
                    
                    document.getElementById('lblLastDonation').textContent = displayDate;
                    // ==========================================
                    
                    const statusEl = document.getElementById('lblStatus');
                    statusEl.textContent = result.donor.status;
                    
                    if (result.donor.status === 'Active') {
                        statusEl.style.color = 'green';
                        statusEl.style.fontWeight = 'bold';
                    } else {
                        statusEl.style.color = 'orange';
                    }

                } else {
                    msgDiv.textContent = 'Error: ' + result.message;
                    msgDiv.style.color = 'red';
                }
            } catch (error) {
                msgDiv.textContent = 'Connection error while fetching donor profile.';
                msgDiv.style.color = 'red';
                console.error(error);
            }
        }

        function goBack() {
            if (role === 'Organiser_user') {
                window.location.href = 'organiser.html';
            } else if (role === 'Data_entry_user') {
                window.location.href = 'data_entry.html';
            } else {
                window.history.back(); 
            }
        }
    </script>
</body>
</html>
