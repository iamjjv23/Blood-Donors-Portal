<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Entry Dashboard | Blood Donation Portal</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="icon" type="image/x-icon" href="../img/favicon.png">
</head>
<body class="bodybg">
					
  <div class="container">
					
        <div class="header">
            <h2>Data Entry Form</h2>
            <div class="header-buttons" id="navButtons">
                <button class="btn-logout" onclick="logout()">Logout</button>
            </div>
        </div>
		<center><img class="logosimg" src="../img/dpll.png" alt="Logo"></center>
		<!--
        <div class="search-box">
            <label style="margin-bottom: 10px; color:#333;">Quick Profile Lookup:</label>
            <div class="search-container">
                <input type="text" id="searchContact" placeholder="Type contact number or name..." autocomplete="off">
                <ul id="suggestionsList" class="suggestions-dropdown"></ul>
            </div>
            <small id="searchStatus" style="color: #666; display: block; margin-top: 5px;">Loading contacts database...</small>
        </div>
        -->
        <div id="message"></div>

        <form id="donorForm">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" required placeholder="Donor Name">
            </div>
            
            <div class="form-group">
                <label for="bloodGroup">Blood Group</label>
                <select id="bloodGroup" required>
                    <option value="">Select Blood Group</option>
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                </select>
            </div>

            <div class="form-group">
                <label for="contact">Contact Number</label>
                <input type="tel" id="contact" required placeholder="Mobile Number" pattern="[0-9]{10}" maxlength="10" title="Contact number must be exactly 10 digits">
                <small style="color: #666; display: block; margin-top: 5px;">Contact for enquiry on BLOOD TEST RESULTS and further emergencies.</small>
            </div>

            <div class="form-group">
                <label for="campName">Donation Camp / Appointment</label>
                <select id="campName" required>
                    <option value="">Loading...</option>
                </select>
                <small style="color: #666; display: block; margin-top: 5px;">Selected based on your Host.</small>
            </div>

            <div class="form-group">
                <label for="location">Address</label>
                <input type="text" id="location" required placeholder="Address of Donor">
            </div>

            <div class="form-group">
                <label for="lastDonation">Donation Date</label>
                <input type="date" id="lastDonation" required>
                <small style="color: #666;">Defaults to today's date.</small>
            </div>

            <button type="submit" class="btn-submit">Register Donor</button>
        </form>
    </div>

    <script>
        const API = 'UPH';
        const token = localStorage.getItem('token');
        const role = localStorage.getItem('role');
        
        let donorsCache = null;

        window.onload = () => {
            if (!token) {
                alert('Unauthorized access. Redirecting to login.');
                window.location.href = '../index.html'; 
                return;
            }

            if (role === 'Organiser_user' || role === 'Master_admin') {
                const navContainer = document.getElementById('navButtons');
                const backBtn = document.createElement('button');
                backBtn.className = 'btn-nav';
                backBtn.textContent = 'Dashboard';
                backBtn.onclick = () => window.location.href = (role === 'Organiser_user') ? 'organiser.html' : 'master.html';
                navContainer.insertBefore(backBtn, navContainer.firstChild);
            }

            const navContainer = document.getElementById('navButtons');
            const viewBtn = document.createElement('button');
            viewBtn.className = 'btn-nav';
            viewBtn.textContent = 'View All Donors';
            viewBtn.onclick = () => window.location.href = 'view_donors.html';
            navContainer.insertBefore(viewBtn, navContainer.firstChild);

            const today = new Date().toISOString().split('T')[0];
            document.getElementById('lastDonation').value = today;

            fetchInitialData();
        };

        async function fetchInitialData() {
            const statusText = document.getElementById('searchStatus');
            
            fetch(`${API}?action=getFormConfig&token=${token}`)
                .then(res => res.json())
                .then(result => {
                    if (result.status === 'success') {
                        const campSelect = document.getElementById('campName');
                        campSelect.innerHTML = ''; 
                        result.camps.forEach(camp => {
                            const opt = document.createElement('option');
                            opt.value = camp; opt.textContent = camp;
                            campSelect.appendChild(opt);
                        });
                        if (result.defaultCamp && result.camps.includes(result.defaultCamp)) {
                            campSelect.value = result.defaultCamp;
                        }
                    }
                }).catch(err => console.error("Error loading camps", err));

            try {
                const response = await fetch(`${API}?action=getAllDonors&token=${token}`);
                const result = await response.json();

                if (result.status === 'success') {
                    donorsCache = result.donors;
                    statusText.textContent = 'Ready: Start typing to search.';
                    statusText.style.color = 'green';
                } else {
                    statusText.textContent = 'Search offline. Try reloading.';
                    statusText.style.color = 'red';
                }
            } catch (error) {
                statusText.textContent = 'Connection error. Search disabled.';
                statusText.style.color = 'red';
            }
        }

        const searchInput = document.getElementById('searchContact');
        const suggestionsList = document.getElementById('suggestionsList');

        searchInput.addEventListener('input', function() {
            const query = this.value.trim().toLowerCase();
            suggestionsList.innerHTML = '';

            if (query.length === 0 || !donorsCache) {
                suggestionsList.style.display = 'none';
                return;
            }

            const matches = donorsCache.filter(donor => 
                donor.contact.toLowerCase().includes(query) || 
                donor.name.toLowerCase().includes(query)
            );

            if (matches.length > 0) {
                suggestionsList.style.display = 'block';
                matches.forEach(donor => {
                    const li = document.createElement('li');
                    li.innerHTML = `<strong>${donor.contact}</strong> - ${donor.name} <em>(${donor.bloodGroup})</em>`;
                    li.onclick = () => { window.location.href = `donor.html?id=${donor.id}`; };
                    suggestionsList.appendChild(li);
                });
            } else {
                suggestionsList.style.display = 'block';
                const li = document.createElement('li');
                li.className = 'no-results';
                li.textContent = 'No matching contacts found';
                suggestionsList.appendChild(li);
            }
        });

        document.addEventListener('click', function(e) {
            if (e.target !== searchInput && e.target !== suggestionsList) {
                suggestionsList.style.display = 'none';
            }
        });

        document.getElementById('donorForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msgDiv = document.getElementById('message');
            msgDiv.textContent = 'Saving donor data...';
            msgDiv.style.color = '#0056b3';

            const payload = {
                action: 'addDonor', token: token,
                donorData: {
                    name: document.getElementById('name').value.trim(),
                    bloodGroup: document.getElementById('bloodGroup').value,
                    contact: document.getElementById('contact').value.trim(),
                    campName: document.getElementById('campName').value.trim(),
                    location: document.getElementById('location').value.trim(),
                    lastDonation: document.getElementById('lastDonation').value || 'Never'
                }
            };

            try {
                const response = await fetch(API, { method: 'POST', body: JSON.stringify(payload) });
                const result = await response.json();

                if (result.status === 'success') {
                    msgDiv.innerHTML = `Success! Donor registered with ID: <strong>${result.id}</strong>`;
                    msgDiv.style.color = 'green';
                    
                    document.getElementById('name').value = '';
                    document.getElementById('contact').value = '';
                    document.getElementById('location').value = '';
                    document.getElementById('bloodGroup').selectedIndex = 0;
                    
                    if (donorsCache) {
                        donorsCache.push({
                            id: result.id, name: payload.donorData.name,
                            contact: payload.donorData.contact,
                            bloodGroup: payload.donorData.bloodGroup,
                            campName: payload.donorData.campName
                        });
                    }
                } else {
                    msgDiv.textContent = 'Error: ' + result.message;
                    msgDiv.style.color = 'red';
                }
            } catch (error) {
                msgDiv.textContent = 'Connection failed. Check your network or Web App URL.';
                msgDiv.style.color = 'red';
            }
        });

        function logout() {
            localStorage.clear();
            window.location.href = '../index.html'; 
        }
    </script>
</body>
</html>
