<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organiser Details | Blood Donation Portal</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="icon" type="image/x-icon" href="../img/favicon.png">
</head>
<body class="bodybg">
    
    <div class="container" style="max-width: 1000px;">
        <div class="header">
            <h2>Organiser Team Records</h2>
            <div>
                <button class="btn-nav" onclick="window.location.href='master.html'">&larr; Back to Master</button>
                <button class="btn-logout" onclick="logout()">Logout</button>
            </div>
        </div>
        
        <div class="org-header">
            <h3>Team: <span id="displayOrgName">Loading...</span></h3>
        </div>

        <div id="message">Loading database records...</div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Blood Group</th>
                        <th>Contact</th>
                        <th>Location</th>
                        <th>Camp Name</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="donorTableBody">
                    <!-- Data will be injected here by JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="../js/organiser_details.js"></script>
</body>
</html>
