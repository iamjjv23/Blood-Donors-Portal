<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View All Donors | Blood Donation Portal</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="icon" type="image/x-icon" href="../img/favicon.png">
</head>
<body class="bodybg">
    
    <div class="container">
        <div class="header">
		
            
            <div>
			<center><img class="logosimg" src="../img/dpll.png" alt="Logo"></center>
			</div>
			<div>
                <button style="float: right;" class="btn-logout" onclick="logout()">Logout</button>
				<br><br><br><br>
				<button class="btn-nav" onclick="goBack()">Back to Dashboard</button>
                <button class="btn-nav" onclick="window.location.href='data_entry.html'">Data Entry Form</button>
                
            </div>
        </div>
        
        

        <div class="table-responsive">
		<h2>Donor Database</h2>
		<div id="message">Loading database...</div>
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Blood Group</th>
                        <th>Contact</th>
                        <th>Location</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="donorTableBody">
                    <!-- Data will be injected here by JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const API = 'UPH';
        const token = localStorage.getItem('token');
        const role = localStorage.getItem('role');

        window.onload = () => {
            if (!token) {
                alert('Unauthorized access. Redirecting to login.');
                window.location.href = '../index.html'; 
                return;
            }
            fetchDonors();
        };

        async function fetchDonors() {
            const tableBody = document.getElementById('donorTableBody');
            const msgDiv = document.getElementById('message');
            
            try {
                const response = await fetch(`${API}?action=getAllDonors&token=${token}`);
                const result = await response.json();

                if (result.status === 'success') {
                    msgDiv.style.display = 'none'; 
                    tableBody.innerHTML = '';
                    
                    if (result.donors.length === 0) {
                        tableBody.innerHTML = '<tr><td colspan="6" style="text-align:center;">No donors found in the database.</td></tr>';
                        return;
                    }

                    result.donors.forEach(donor => {
                        const row = `<tr>
                            <td><strong>${donor.name}</strong></td>
                            <td><span class="blood-badge">${donor.bloodGroup}</span></td>
                            <td>${donor.contact}</td>
                            <td>${donor.location}</td>
                            <td style="color: ${donor.status === 'Active' ? 'green' : 'orange'}; font-weight: bold;">
                                ${donor.status}
                            </td>
                            <td><a href="donor.html?id=${donor.id}" class="btn-view">View Profile</a></td>
                        </tr>`;
                        tableBody.innerHTML += row;
                    });
                } else {
                    msgDiv.textContent = 'Error: ' + result.message;
                    msgDiv.style.color = 'red';
                }
            } catch (error) {
                msgDiv.textContent = 'Connection error while fetching data.';
                msgDiv.style.color = 'red';
            }
        }

        function goBack() {
            if (role === 'Master_admin') window.location.href = 'master.html';
            else if (role === 'Organiser_user') window.location.href = 'organiser.html';
            else if (role === 'Data_entry_user') window.location.href = 'data_entry.html';
            else window.location.href = '../index.html';
        }

        function logout() {
            localStorage.clear();
            window.location.href = '../index.html';
        }
    </script>
</body>
</html>
