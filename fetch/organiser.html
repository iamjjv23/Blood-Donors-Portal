<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organiser Dashboard | Blood Donation Portal</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="icon" type="image/x-icon" href="../img/favicon.png">
</head>
<body class="bodybg">

    <div class="container">
	<center><img class="logosimg" src="../img/dpll.png" alt="Logo"></center>
        <div class="header" style="float: right;">
            
            <div>
                <button class="btn-logout" onclick="logout()">Logout</button>
            </div>
        </div>
        
        <div style="margin-bottom: 20px;">
		<h2>Organiser Dashboard</h2> <br>
            <button class="btn-nav tab-btn active-tab" onclick="showSection('donorSection', this)">Dashboard Overview</button>
            <button class="btn-nav tab-btn" onclick="showSection('userSection', this)">Add New User</button>
			<button class="btn-nav" onclick="window.location.href='data_entry.html'">Data Entry Form</button>
        </div>

        <div id="message"></div>

        <div id="donorSection" class="section active">
            <div style="display: flex; justify-content: center;">
                <div class="summary-card" style="width: 100%; max-width: 450px; background-color: #e8f4f8;">
                    <h3>Donors registered:</h3>
                    <p class="stat-number" id="teamDonorsCount" style="color: #0056b3;">...</p>
                </div>
            </div>
            <div style="text-align: center; margin-top: 20px;">
                <a href="view_donors.html" class="view-link">View Full Donor Database &rarr;</a>
            </div>
        </div>

        <div id="userSection" class="section">
            <h3>Create New User</h3>
            <form id="addUserForm">
                <div class="form-group">
                    <label>Username:</label>
                    <input type="text" id="newUsername" required>
                </div>
                <div class="form-group">
                    <label>Password:</label>
                    <input type="password" id="newPassword" required>
                </div>
                <div class="form-group">
                    <label>Role:</label>
                    <select id="newRole" required>
                        <option value="Data_entry_user">Data Entry User</option>
                    </select>
                </div>
                <button type="submit" class="btn-submit">Create User</button>
            </form>
        </div>
    </div>

    <script>
        const API = 'UPH';
        const token = localStorage.getItem('token');
        const role = localStorage.getItem('role');

        window.onload = () => {
            if (!token || (role !== 'Organiser_user' && role !== 'Master_admin')) {
                alert('Unauthorized access. Redirecting to login.');
                window.location.href = '../index.html'; 
            } else {
                fetchDonorCount();
            }
        };

        function showSection(sectionId, clickedBtn) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.getElementById(sectionId).classList.add('active');
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active-tab'));
            clickedBtn.classList.add('active-tab');
            document.getElementById('message').textContent = '';
        }

        async function fetchDonorCount() {
            try {
                const response = await fetch(`${API}?action=getStats&token=${token}`);
                const result = await response.json();

                if (result.status === 'success') {
                    document.getElementById('teamDonorsCount').textContent = result.teamCount;
                } else {
                    document.getElementById('message').textContent = 'Error: ' + result.message;
                }
            } catch (error) {
                document.getElementById('message').textContent = 'Connection error while fetching data.';
            }
        }

        document.getElementById('addUserForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msgDiv = document.getElementById('message');
            msgDiv.textContent = 'Creating user...';
            msgDiv.style.color = '#0056b3';

            const payload = {
                action: 'addUser',
                token: token,
                userData: {
                    username: document.getElementById('newUsername').value.trim(),
                    password: document.getElementById('newPassword').value,
                    role: document.getElementById('newRole').value
                }
            };

            try {
                const response = await fetch(API, { method: 'POST', body: JSON.stringify(payload) });
                const result = await response.json();

                if (result.status === 'success') {
                    msgDiv.textContent = 'User successfully created!';
                    msgDiv.style.color = 'green';
                    document.getElementById('addUserForm').reset();
                } else {
                    msgDiv.textContent = 'Error: ' + result.message;
                    msgDiv.style.color = 'red';
                }
            } catch (error) {
                msgDiv.textContent = 'Connection failed.';
                msgDiv.style.color = 'red';
            }
        });

        function logout() {
            localStorage.clear();
            window.location.href = '../index.html';
        }
    </script>
</body>
</html>
