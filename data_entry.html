<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Entry Dashboard | Blood Donation Portal</title>
    <style>
        body {
            font-family: Arial, sans-serif; background-color: #f4f7f6;
            margin: 0; padding: 20px; display: flex; justify-content: center;
        }
        .container {
            background-color: white; padding: 30px; border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 100%; max-width: 600px;
        }
        .header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 20px;
        }
        h2 { margin: 0; color: #333; }
        .header-buttons button {
            color: white; border: none; padding: 8px 12px; 
            border-radius: 4px; cursor: pointer; margin-left: 5px;
        }
        .btn-nav { background-color: #0056b3; }
        .btn-nav:hover { background-color: #004494; }
        .btn-logout { background-color: #555; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input[type="text"], input[type="tel"], input[type="date"], select {
            width: 100%; padding: 10px; border: 1px solid #ccc;
            border-radius: 4px; box-sizing: border-box;
        }
        .btn-submit {
            background-color: #28a745; color: white; border: none;
            padding: 12px; border-radius: 4px; cursor: pointer;
            width: 100%; font-size: 16px; font-weight: bold; margin-top: 10px;
        }
        .btn-submit:hover { background-color: #218838; }
        #message { margin-bottom: 15px; font-weight: bold; text-align: center; }

        /* Quick Search & Auto-Complete Styles */
        .search-box {
            background-color: #f8f9fa; padding: 15px; border-radius: 6px;
            border: 1px solid #ddd; margin-bottom: 25px;
        }
        .search-container { position: relative; width: 100%; }
        .search-container input { margin-bottom: 0; }
        .suggestions-dropdown {
            position: absolute; top: 100%; left: 0; right: 0;
            background: white; border: 1px solid #ccc; border-top: none;
            border-radius: 0 0 4px 4px; max-height: 200px; overflow-y: auto;
            margin: 0; padding: 0; list-style: none; z-index: 1000;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: none;
        }
        .suggestions-dropdown li {
            padding: 10px; cursor: pointer; border-bottom: 1px solid #eee;
        }
        .suggestions-dropdown li:hover { background-color: #f0f0f0; }
        .suggestions-dropdown .no-results { color: #d32f2f; cursor: default; }
        .suggestions-dropdown .no-results:hover { background-color: white; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>Data Entry Form</h2>
			<div class="header-buttons" id="navButtons">
			<button class="btn-nav" onclick="window.location.href='view_donors.html'">View All Donors</button>
			</div>
            <div class="header-buttons" id="navButtons">
                <button class="btn-logout" onclick="logout()">Logout</button>
            </div>
        </div>

        <!-- Quick Lookup with Live Suggestions -->
        <div class="search-box">
            <label style="margin-bottom: 10px; color:#333;">Quick Profile Lookup:</label>
            <div class="search-container">
                <input type="text" id="searchContact" placeholder="Type contact number or name..." autocomplete="off">
                <ul id="suggestionsList" class="suggestions-dropdown"></ul>
            </div>
            <small id="searchStatus" style="color: #666; display: block; margin-top: 5px;">Loading contacts database...</small>
        </div>
        
        <div id="message"></div>

        <!-- NEW DONOR FORM -->
        <form id="donorForm">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" required placeholder="Name of the Donor">
            </div>
            
            <div class="form-group">
                <label for="bloodGroup">Blood Group</label>
                <select id="bloodGroup" required>
                    <option value="">Select Blood Group</option>
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                </select>
            </div>

            <!-- UPDATED: 10-Digit validation pattern -->
            <div class="form-group">
                <label for="contact">Contact Number</label>
                <input type="tel" id="contact" required placeholder="Enter Mobile Number" pattern="[0-9]{10}" maxlength="10" title="Contact number must be exactly 10 digits">
                <small style="color: #666; display: block; margin-top: 5px;">Contact for enquiry if emergency or test results</small>
            </div>

            <div class="form-group">
                <label for="location">Address:</label>
                <input type="text" id="location" required placeholder="Enter address of Donor">
            </div>

            <div class="form-group">
                <label for="lastDonation">Last Donation Date</label>
                <input type="date" id="lastDonation">
                <small style="color: #666;">Leave blank if first-time donor.</small>
            </div>

            <button type="submit" class="btn-submit">Register Donor</button>
        </form>
    </div>
