<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Blood Donation Portal</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" type="image/x-icon" href="img/favicon.png">
</head>
<body class="loginbg">
        
    <div class="muck-up">
        <div class="overlay"></div>
        <div class="content">
            
            <div class="logo">
                <img class="logoimg" src="img/dpl.png" alt="Logo">
            </div>
            
            <div class="login">
                <p class="loginhead">Blood Donor's Portal Login</p>
                <div id="message"></div>
                
                <form id="loginForm">
                    <div class="form-group">
                        <label class="logintext" for="username">Username</label>
                        <input type="text" id="username" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="logintext" for="password">Password</label>
                        <input type="password" id="password" required>
                    </div>
                    
                    <button type="submit" class="btn-submit">Sign In</button>
                </form>
            </div>
            
        </div>
    </div>

    <script>
        // FIXED: Removed double "const" and restored your actual Web App URL
        const API = 'https://script.google.com/macros/s/AKfycbwS2kfwhaNRWfhcskWi0PTzoHCHqzyHGo0vOVg8rKbFQGJwEv_3orDSHOJ7hXtcFJO36w/exec';
        
        // FIXED: Safe storage clear on load
        document.addEventListener('DOMContentLoaded', () => {
            localStorage.clear();
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            // Explicitly prevents the page from refreshing
            e.preventDefault(); 
            
            const msgDiv = document.getElementById('message');
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();

            msgDiv.textContent = 'Authenticating...';
            msgDiv.style.color = '#0056b3';

            const payload = { action: 'login', username: user, password: pass };

            try {
                const response = await fetch(API, {
                    method: 'POST',
                    // FIXED: Re-added the crucial header to prevent Google Apps Script CORS crash
                    headers: {
                        'Content-Type': 'text/plain;charset=utf-8' 
                    },
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();

                if (result.status === 'success') {
                    msgDiv.textContent = 'Login successful! Redirecting...';
                    msgDiv.style.color = 'green';
                    
                    localStorage.setItem('token', result.token);
                    localStorage.setItem('role', result.role);
                    localStorage.setItem('userId', result.userId);

                    if (result.role === 'Master_admin') {
                        window.location.href = 'fetch/master.html';
                    } else if (result.role === 'Organiser_user') {
                        window.location.href = 'fetch/organiser.html';
                    } else if (result.role === 'Data_entry_user') {
                        window.location.href = 'fetch/data_entry.html';
                    } else {
                        msgDiv.textContent = 'Unknown role assigned.';
                        msgDiv.style.color = 'red';
                    }
                } else {
                    msgDiv.textContent = 'Invalid credentials. Please try again.';
                    msgDiv.style.color = 'red';
                }
            } catch (error) {
                msgDiv.textContent = 'Connection failed. Check your Web App URL.';
                msgDiv.style.color = 'red';
                console.error('Login Error:', error);
            }
        });
    </script>
</body>
</html>
