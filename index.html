<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Blood Donation Portal</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" type="image/x-icon" href="img/favicon.png">
</head>
<body class="loginbg">
        
    <div class="muck-up">
        <div class="overlay"></div>
        <div class="content">
            
            <div class="logo">
                <img class="logoimg" src="img/dpl.png" alt="Logo">
            </div>
            
            <div class="login">
                <p class="loginhead">Blood Donor's Portal Login</p>
                
				<div id="message"></div>
				
                <form id="loginForm">
                    <div class="form-group">
                        <label class="logintext" for="username">Username</label>
                        <input type="text" id="username" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="logintext" for="password">Password</label>
                        <input type="password" id="password" required>
                    </div>
                    
                    <button type="submit" class="btn-submit">Sign In</button>
                </form>
            </div>

        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
